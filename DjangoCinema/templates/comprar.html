<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJANGO CINEMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body class="container mt-3">
  <header>
   <div class="alert alert-primary text-center display-3" role="alert">
    DJANGO CINEMA
   </div>
  </header>
  <main>

    <div class="row justify-content-center align-items-top g-2">
        <div class="col-4">
            <img src="/media/{{ funcion.pelicula.imagen }} class="img-fluid>
            <p>
              {{ funcion }}
              <br>{{ funcion.fecha}},     {{funcion.hora}}
              <br>Sala : {{funcion.sala}}
              <br>Precio : {{funcion.precio}}
              <br>Asientos disponibles : {{funcion.asientos_disponibles}}
            </p>
        </div>
        <div class="col">
            <h1 class="display-4">{{ funcion }}</h1>
            <form method="POST">
            {% csrf_token %}
            {{ form.as_p}}
             <a name="" id="" class="btn-danger" href="/" role="button">Cancelar</a>
             <button type="submit" class="btn btn-primary float-end">Comprar</button>
        </form> </div>
    </div>

  </main>

  <footer>

  </footer>
  <div class="alert alert-dark my-3 text-center" role="alert">
    Todos los derechos reservados
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-7VPbUDkoPSGFnVtYi0QogXtr74QeVeeIs99Qfg5YCF+TidwNdjvaKZX19NZ/e6oz" crossorigin="anonymous">
  </script>
</body>

</html>
